[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-email-analyzer"
version = "1.0.0"
description = "Static SOC phishing-triage CLI: parse, analyse headers/IOCs/attachments, score, report"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Maaz Husain" }]
keywords = ["phishing", "email", "security", "soc", "dfir", "triage", "ioc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "extract-msg>=0.45",
    "oletools>=0.60",
    "tldextract>=5.0",
    "iocextract>=1.16",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
phishing-analyzer = "src.cli:main"

[tool.setuptools]
packages = ["src"]
